[package]
name = "relay-history"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.1"
aes-gcm = "0.11.1"
anyhow.workspace = true
base64 = "0.22.1"
cbc = "0.2.1"
relay-core.workspace = true
relay-store.workspace = true
serde_json.workspace = true
sha1 = "0.11.0"
# NOTE: same git source and tag as libsignal-service-rs (and so presage) uses.
# Cargo treats a different tag or rev as a different source, which would link
# two copies of libsignal-core and friends into one binary. Cargo.lock pins the
# commit (439f035d9c for v0.99.0); bump this together with presage.
# `test-util` is what makes the generated backup protos public; it adds no code
# to the import path.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
futures.workspace = true
pbkdf2 = "0.13.0"
protobuf = "3.7.2"
zkgroup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
