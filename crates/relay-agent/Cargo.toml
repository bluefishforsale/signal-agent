[package]
name = "relay-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
dirs.workspace = true
futures.workspace = true
relay-core.workspace = true
relay-setup.workspace = true
relay-signal.workspace = true
relay-store.workspace = true
relay-tools.workspace = true
# Already in the graph through libsignal-service; same version and TLS stack.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = { version = "3.6.0", default-features = false, features = ["server"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
rmcp = { version = "3.6.0", default-features = false, features = ["client", "server"] }
uuid.workspace = true
