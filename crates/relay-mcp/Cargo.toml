[package]
name = "relay-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytes = "1.12.1"
getrandom.workspace = true
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
relay-agent.workspace = true
relay-core.workspace = true
rmcp = { version = "3.6.0", default-features = false, features = ["client", "server", "transport-streamable-http-server"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
subtle = "2.6.1"
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
relay-signal.workspace = true
relay-store.workspace = true
relay-tools.workspace = true
rmcp = { version = "3.6.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3"
tracing-subscriber = "0.3.23"
uuid.workspace = true
