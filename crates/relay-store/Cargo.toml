[package]
name = "relay-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
relay-core.workspace = true
relay-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
# NOTE: every crate linking libsqlite3-sys declares exactly this, so Cargo's
# feature unification yields one SQLCipher with one crypto backend whatever
# else is in the graph (docs/slices.md, "One SQLCipher").
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-custom-crypto"] }
log = "0.4.34"

# The fork's build.rs still demands OpenSSL on Windows even with custom crypto.
[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
proptest.workspace = true
tempfile = "3.27.0"
tokio.workspace = true
uuid.workspace = true
