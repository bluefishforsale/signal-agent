[package]
name = "relay-signal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22.1"
futures.workspace = true
relay-core.workspace = true
serde.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2.5.8"
# NOTE: pinned to an exact rev (PRD anti-goal 7: no fork, pin a revision). presage's
# sqlite store brings the bundled SQLCipher the whole binary shares; see the root
# [patch.crates-io], which must move with this rev.
presage = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c" }

# NOTE: SQLCipher's crypto comes from RustCrypto, not OpenSSL or CommonCrypto.
# The default links the system libcrypto on Linux and panics on Windows without
# an OpenSSL install, which neither CI nor a user's machine has. Feature
# unification applies this to every crate linking libsqlite3-sys (the message
# store too), which is the point: one SQLCipher, one crypto, every platform.
# Nothing to register at startup: libsqlite3-sys itself exports the
# rusqlite_custom_crypto_setup hook SQLCipher calls, so linking is enough.
# store_refuses_to_open_with_the_wrong_key fails if encryption ever goes missing.

# NOTE: at this libsqlite3-sys rev the Windows build.rs panics without
# OPENSSL_DIR even with custom crypto, so Windows also vendors OpenSSL. relay-store
# declares the same; keep the two identical (docs/slices.md).
[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-vendored-openssl"] }

# NOTE: ARM Linux can't use custom crypto: the whisperfish fork's
# sqlcipher_custom_crypto.rs hard-codes *const i8 where C's char is unsigned
# there, so it doesn't compile. ARM Linux vendors OpenSSL like Windows does.
# Revert once the c_char fix lands upstream (see docs/slices.md).
[target.'cfg(not(all(target_os = "linux", any(target_arch = "aarch64", target_arch = "arm"))))'.dependencies]
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-custom-crypto"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "aarch64", target_arch = "arm")))'.dependencies]
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
chrono = "0.4.45"
getrandom.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
