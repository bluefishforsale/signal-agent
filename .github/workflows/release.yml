name: release

# A v* tag builds, signs and notarizes every installer and publishes them as a
# GitHub release once every job passes (PRD goal 2); v0.0.0-signing-test stays a
# draft. Everything else never signs or publishes: a pull request
# that touches the release path, or a manual `dry-run`, proves the whole pipeline
# unsigned; a manual `check-secrets` runs only the signing-input gate.
#
# NOTE: "signed" means `github.event_name == 'push'`, which the trigger limits to
# v* tags. Signing secrets are referenced only in jobs bound to the `release`
# environment, and every publishing path waits on the preflight secrets check.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - app/src-tauri/tauri.conf.json
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run builds everything unsigned; check-secrets runs only the release gate
        type: choice
        options: [dry-run, check-secrets]
        default: dry-run

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # crates.io and git fetches flake on hosted runners ("curl failed", HTTP2
  # framing errors); retry harder, wait longer, skip HTTP2 multiplexing, and let
  # the git CLI fetch git dependencies.
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  TAURI_CLI: npx --yes @tauri-apps/cli@2.12.4
  # Builds, signs, notarizes and staples only the macOS app into a draft
  # release, to prove the Apple half before every signing input exists.
  SIGNING_TEST_TAG: v0.0.0-signing-test

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' || inputs.mode == 'check-secrets') && 'release' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing_test: ${{ github.ref_name == env.SIGNING_TEST_TAG }}
      # NOTE: WINDOWS_UNSIGNED=true on the release environment ships Windows
      # unsigned until Azure Artifact Signing works. It must be set on purpose;
      # missing Azure inputs alone still fail the release (PRD acceptance 11).
      windows_signed: ${{ github.event_name == 'push' && vars.WINDOWS_UNSIGNED != 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every signing input is present
        if: github.event_name == 'push' || inputs.mode == 'check-secrets'
        env:
          # The signing test only signs the macOS app, so it needs only Apple's.
          SCOPE: ${{ github.ref_name == env.SIGNING_TEST_TAG && 'apple' || vars.WINDOWS_UNSIGNED == 'true' && 'no-windows' || 'all' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/check-release-secrets.sh "$SCOPE"
      - id: version
        name: Tag matches the app and workspace versions
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [[ "$version" == "$workspace" ]] || { echo "::error::tauri.conf.json is $version but Cargo.toml is $workspace"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" && "$GITHUB_REF_NAME" != "$SIGNING_TEST_TAG" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  macos:
    needs: preflight
    if: inputs.mode != 'check-secrets'
    # mini-tv, the homelab's Mac (homelab repo, macos_runner.yaml), takes tag
    # pushes and dispatches of main; everything else stays on hosted Macs.
    # NOTE: this expression is routing, not the security boundary. This repo is
    # public, so a fork's pull request could edit it; mini-tv's job-started hook
    # refuses any job outside this same set.
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && fromJSON('["self-hosted", "macOS", "mini-tv"]') || 'macos-latest' }}
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUNDLE: target/universal-apple-darwin/release/bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-universal-apple-darwin
      - uses: ./.github/actions/setup-protoc
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the signal-agent CLI the app ships
        run: |
          cargo build --release --locked -p signal-agent --target aarch64-apple-darwin --target x86_64-apple-darwin
          scripts/stage-agent-sidecar.sh universal-apple-darwin
      - name: Signing keychain and notarization key
        if: github.event_name == 'push'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: scripts/macos-signing-setup.sh
      - name: Build, sign and notarize the app
        if: github.event_name == 'push'
        working-directory: app/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: $TAURI_CLI build --ci --target universal-apple-darwin --bundles app,dmg
      - name: Build the app unsigned (dry run)
        if: github.event_name != 'push'
        working-directory: app/src-tauri
        run: $TAURI_CLI build --ci --target universal-apple-darwin --bundles app,dmg
      - name: The app carries signal-agent and the login agent plist
        run: scripts/check-macos-bundle.sh "$BUNDLE/macos/MCP Relay for Signal.app"
      - name: Sign, notarize and staple the dmg
        if: github.event_name == 'push'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          dmg=$(echo "$BUNDLE"/dmg/*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
      - name: Gatekeeper accepts the app and dmg
        if: github.event_name == 'push'
        run: |
          app=$(echo "$BUNDLE"/macos/*.app)
          dmg=$(echo "$BUNDLE"/dmg/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/signal-agent"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Package the dmg and updater payload
        run: |
          mkdir dist
          cp "$BUNDLE"/dmg/*.dmg "dist/signal-agent-$VERSION-macos-universal.dmg"
          COPYFILE_DISABLE=1 tar -czf "dist/signal-agent-$VERSION-macos-universal.app.tar.gz" -C "$BUNDLE/macos" "MCP Relay for Signal.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-macos-universal
          path: dist/*
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always() && github.event_name == 'push'
        run: scripts/macos-signing-cleanup.sh

  # Built inside Ubuntu 20.04 so the binary links against glibc 2.31, the
  # oldest the PRD promises; a newer build host would silently raise the floor.
  linux:
    needs: preflight
    if: inputs.mode != 'check-secrets' && needs.preflight.outputs.signing_test != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates clang cmake curl git perl pkg-config unzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-${{ matrix.arch }}
      - uses: ./.github/actions/setup-protoc
      - run: cargo build --release --locked -p signal-agent
      - name: Binary runs on glibc 2.31
        run: |
          ldd --version | sed -n 1p
          scripts/check-glibc.sh target/release/signal-agent 2.31
      - name: Package the CLI tarball
        run: |
          name="signal-agent-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p "stage/$name" dist
          cp target/release/signal-agent LICENSE README.md "stage/$name/"
          tar -czf "dist/$name.tar.gz" -C stage "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Windows signs in two passes because the signing action runs only on x64
  # runners: the app exe is signed before NSIS packs it, then the installer.
  windows-build:
    needs: preflight
    if: inputs.mode != 'check-secrets' && needs.preflight.outputs.signing_test != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - uses: ./.github/actions/setup-protoc
      - run: rustup target add ${{ matrix.target }}
      # NOTE: pwsh, like ci.yml, because vendored OpenSSL needs Strawberry Perl;
      # under Git Bash the msys perl comes first on PATH and its build fails.
      - run: cargo build --release --locked -p signal-agent --target ${{ matrix.target }}
        shell: pwsh
      - run: scripts/stage-agent-sidecar.sh ${{ matrix.target }}
      - run: Invoke-Expression "$env:TAURI_CLI build --ci --target ${{ matrix.target }} --no-bundle"
        shell: pwsh
        working-directory: app/src-tauri
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-app-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/relay-app.exe
            target/${{ matrix.target }}/release/signal-agent.exe
          if-no-files-found: error

  windows-sign-app:
    needs: [preflight, windows-build]
    if: needs.preflight.outputs.windows_signed == 'true'
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-app-${{ matrix.arch }}
          path: app-exe
      # NOTE: signal-agent-ci's only role is Certificate Profile Signer on the
      # signing account, not the subscription, so login must not require one
      # ("No subscriptions found" otherwise). Same at every azure/login below.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\app-exe
          files-folder-filter: exe
          exclude-environment-credential: true
      - run: ./scripts/verify-authenticode.ps1 -Folder app-exe
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-app-${{ matrix.arch }}
          path: app-exe/*.exe
          if-no-files-found: error
          overwrite: true

  windows-bundle:
    needs: [preflight, windows-build, windows-sign-app]
    if: >-
      !cancelled() && needs.windows-build.result == 'success' &&
      (needs.windows-sign-app.result == 'success' || needs.preflight.outputs.windows_signed != 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    # Bundling only packs exes built earlier, so arm64 bundles on x64 too: the
    # signing tooling below is x64, and this keeps it off ARM emulation.
    runs-on: windows-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-app-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release
      - run: scripts/stage-agent-sidecar.sh ${{ matrix.target }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: needs.preflight.outputs.windows_signed == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - if: needs.preflight.outputs.windows_signed == 'true'
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.20 -Force -Repository PSGallery
        shell: pwsh
      # The uninstaller is written while NSIS compiles, so only Tauri's
      # signCommand can sign it (#76). Unsigned runs record what the hook was
      # handed instead of signing it.
      - name: Bundle, signing through scripts/sign-windows.ps1
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          SIGN_RECORD: ${{ needs.preflight.outputs.windows_signed != 'true' && format('{0}\sign-record.txt', runner.temp) || '' }}
        run: |
          config=$(jq -nc --arg record "$SIGN_RECORD" '{bundle: {windows: {signCommand: {cmd: "pwsh",
            args: (["-NoProfile", "-File", "../../scripts/sign-windows.ps1", "-Path", "%1"]
              + (if $record == "" then [] else ["-Record", $record] end))}}}}')
          $TAURI_CLI bundle --ci --target ${{ matrix.target }} --bundles nsis --config "$config"
        working-directory: app/src-tauri
      - name: The sign hook reached the uninstaller
        if: needs.preflight.outputs.windows_signed != 'true'
        shell: pwsh
        run: |
          $record = Join-Path $env:RUNNER_TEMP sign-record.txt
          Get-Content $record
          # makensis hands !uninstfinalize its temp file, named nst*.tmp
          $uninstaller = @(Get-Content $record | Where-Object { (Split-Path -Leaf $_) -like 'nst*.tmp' })
          if ($uninstaller.Count -ne 1) { throw "the sign hook got $($uninstaller.Count) NSIS uninstaller temp files, expected 1" }
      - name: The installer puts signal-agent.exe next to the app
        run: ./scripts/check-nsis-payload.ps1 -Installer (Get-Item target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe).FullName -RequireSigned:$${{ needs.preflight.outputs.windows_signed == 'true' }}
        shell: pwsh
      - name: Name the installer
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe "dist/signal-agent-$VERSION-windows-${{ matrix.arch }}-setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows-sign-installer:
    needs: [preflight, windows-bundle]
    if: needs.preflight.outputs.windows_signed == 'true'
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          exclude-environment-credential: true
      - run: ./scripts/verify-authenticode.ps1 -Folder dist
        shell: pwsh
      - run: ./scripts/check-nsis-payload.ps1 -Installer (Get-Item dist/*-setup.exe).FullName -RequireSigned
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          overwrite: true

  assemble:
    needs: [preflight, macos, linux, windows-bundle, windows-sign-installer]
    if: >-
      !cancelled() && needs.macos.result == 'success' && needs.linux.result == 'success' &&
      needs.windows-bundle.result == 'success' &&
      (needs.windows-sign-installer.result == 'success' || needs.preflight.outputs.windows_signed != 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Updater signatures, latest.json and SHA256SUMS
        if: github.event_name == 'push'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/release-manifest.sh dist "$VERSION" "$BASE_URL"
      - name: Updater signatures with a throwaway key, latest.json and SHA256SUMS (dry run)
        if: github.event_name != 'push'
        run: |
          $TAURI_CLI signer generate --ci --password "" --write-keys "$RUNNER_TEMP/throwaway.key"
          TAURI_SIGNING_PRIVATE_KEY_PATH="$RUNNER_TEMP/throwaway.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            UPDATER_PUBKEY="$(cat "$RUNNER_TEMP/throwaway.key.pub")" \
            scripts/release-manifest.sh dist "$VERSION" "$BASE_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
          path: dist/*
          if-no-files-found: error
      # Publishing is the last step, so it happens only after every platform
      # built, signed and passed its checks. It's live at once: installed
      # copies read releases/latest/download/latest.json.
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WINDOWS_SIGNED: ${{ needs.preflight.outputs.windows_signed }}
        run: |
          notes=""
          if [[ "$WINDOWS_SIGNED" != true ]]; then
            notes="The Windows installers in this release are not code-signed yet, so Windows SmartScreen shows \"Windows protected your PC\". Choose More info, then Run anyway. The macOS app is signed and notarized."
          fi
          # NOTE: a published release's files are never replaced; people may
          # already have them. A leftover draft (an earlier failed run, or a
          # release made before auto-publish) is refreshed and published.
          is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$is_draft" in
            none)
              gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
                --title "MCP Relay for Signal $VERSION" --notes "$notes" --generate-notes ;;
            true)
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
              gh release edit "$GITHUB_REF_NAME" --draft=false ;;
            *)
              echo "::error::$GITHUB_REF_NAME is already published; refusing to replace its files. Tag a new version."
              exit 1 ;;
          esac

  signing-test:
    needs: [preflight, macos]
    if: needs.preflight.outputs.signing_test == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-macos-universal
          path: dist
      - name: Attach the signed macOS app to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "Signing test (not a release)" \
              --notes "The macOS app, signed with Developer ID, notarized and stapled on the homelab runner. Never publish this draft."
          fi
