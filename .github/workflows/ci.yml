name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # On main every commit gets its own group: GitHub keeps only one pending run per
  # group and drops the older one, so a shared group skips merges that land close
  # together. PRs still group by branch so a new push supersedes the old run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Cancel superseded runs on PR branches only; every merge to main gets its own
  # run, so a red main points at one merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # crates.io and git fetches flake on hosted runners ("curl failed", HTTP2
  # framing errors); retry harder, wait longer, skip HTTP2 multiplexing, and let
  # the git CLI fetch git dependencies.
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  # A workflow file GitHub can't run fails silently on a PR (no checks at all),
  # so lint the workflows themselves.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm builds the crates, not just the app, so native pieces
        # (SQLCipher with vendored OpenSSL, libsignal) are proven on ARM64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo clippy --all-targets -- -D warnings
      # NOTE: tests must never reach Signal's servers (a test fixture points at
      # staging, and one accidental dial already happened). clippy has fetched every
      # dependency, so tests run offline behind a dead proxy: any outbound call fails
      # fast instead of reaching Signal. Loopback stays reachable for local test servers.
      - run: cargo test --offline
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
      # The setup window isn't a default member (no GUI on Linux), so it gets
      # its own lint and test run where it ships.
      # tauri-build won't compile relay-app until its signal-agent sidecar is
      # staged. Lint and tests only need the file to exist, so a debug build does.
      - if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build -p signal-agent
          host=$(rustc -vV | sed -n 's/^host: //p')
          ext=; [[ "$host" == *-windows-* ]] && ext=.exe
          mkdir -p app/src-tauri/binaries
          cp "target/debug/signal-agent$ext" "app/src-tauri/binaries/signal-agent-$host$ext"
      - if: runner.os != 'Linux'
        run: cargo clippy -p relay-app --all-targets --all-features -- -D warnings
      - if: runner.os != 'Linux'
        run: cargo test -p relay-app --offline
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1

  # Unsigned test installers on every push, so the bundling path is always
  # proven. Signed builds happen only in release.yml.
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            cli-targets: --target aarch64-apple-darwin --target x86_64-apple-darwin
            # app too: a dmg-only build deletes the .app the bundle check inspects.
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            cli-targets: --target x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            cli-targets: --target aarch64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.target }}
          cache-all-crates: true
      # presage's libsignal-service generates its protobufs with prost-build.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: rustup target add ${{ matrix.rust-targets }}
        shell: bash
      - run: cargo install tauri-cli --version "^2" --locked
      # The app bundles the CLI as a sidecar (see release.yml), so build it first.
      - run: cargo build --release --locked -p signal-agent ${{ matrix.cli-targets }}
      - run: scripts/stage-agent-sidecar.sh ${{ matrix.target }}
        shell: bash
      - run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: app/src-tauri
      - if: runner.os == 'macOS'
        run: scripts/check-macos-bundle.sh "target/${{ matrix.target }}/release/bundle/macos/MCP Relay for Signal.app"
      - if: runner.os == 'Windows'
        run: ./scripts/check-nsis-payload.ps1 -Installer (Get-Item target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe).FullName
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
