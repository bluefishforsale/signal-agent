[package]
name = "relay-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
# A pretend driver that walks every setup screen, for development only.
mock-driver = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dirs.workspace = true
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
relay-agent.workspace = true
relay-core.workspace = true
relay-secrets.workspace = true
relay-setup.workspace = true
relay-signal.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-updater = "=2.13.2"
notify-rust = "=4.18.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
semver = "1.0.28"
tokio.workspace = true

[dev-dependencies]
futures.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true
